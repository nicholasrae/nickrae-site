    <use href="#lateral-arrows" stroke="#152333" stroke-width="7"/>
    <use href="#lateral-arrows" stroke="#dfb8ff" stroke-width="3.5"/>
    <path d="M270 123l15 27h11m-165 40-13 12H99" stroke="#dfb8ff" stroke-width="1.2"/>
  </g>
  <g fill="#ead5ff" font-family="system-ui,sans-serif" font-size="14" font-weight="600">
