    <text x="16" y="218">Tail side force</text>
  </g>
  <g text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#101d2b">
    <circle cx="92" cy="82" r="11" fill="#a8b7c4"/><text x="92" y="87">1</text>
