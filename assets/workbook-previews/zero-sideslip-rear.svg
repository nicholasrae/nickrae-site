<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 236" role="img" aria-labelledby="rear-title rear-desc">
  <title id="rear-title">Zero sideslip seen from behind</title>
  <desc id="rear-desc">A dashed horizontal line marks wings level. The aircraft's right wing, on the operating-engine side, is lower than its left.</desc>
  <defs>
    <pattern id="rear-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#577186" stroke-opacity=".14"/></pattern>
    <linearGradient id="rear-skin" x2=".85" y2="1"><stop stop-color="#f3f3df"/><stop offset="1" stop-color="#8ca9bb"/></linearGradient>
  </defs>
  <rect width="400" height="236" fill="#101d2b"/><rect width="400" height="236" fill="url(#rear-grid)"/>
  <path d="M19 131h362" stroke="#a1b4bf" stroke-dasharray="5 6"/>
  <g transform="rotate(4 200 131)" stroke="#203b4c" stroke-width="1.8" stroke-linejoin="round">
    <path d="M199 124 52 118 46 120Q53 125 89 128L184 138H216L311 128Q347 125 354 120L348 118 201 124Z" fill="url(#rear-skin)"/>
    <g fill="url(#rear-skin)"><ellipse cx="138" cy="124" rx="11" ry="13"/><ellipse cx="262" cy="124" rx="11" ry="13"/></g>
    <circle cx="262" cy="124" r="19" fill="none" stroke="#a6c4cd" opacity=".38"/>
    <path d="M200 111C179 107 181 148 200 150C219 148 221 107 200 111Z" fill="url(#rear-skin)"/>
    <path d="M194 129 197 79Q198 72 201 78L205 128ZM199 130 159 129 152 132 195 137H206L248 132 241 129Z" fill="url(#rear-skin)"/>
  </g>
  <g font-family="system-ui,sans-serif" font-size="15">
    <text x="24" y="155" fill="#c2d0db">Level horizon</text>
    <path d="m353 136 10 25h-26" fill="none" stroke="#f4b95b" stroke-width="1.5"/>
    <text x="336" y="183" text-anchor="end" fill="#f4cb79">Right wing low</text>
  </g>
</svg>
