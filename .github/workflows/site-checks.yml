name: Site source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate links, metadata, products and signup placements
        run: python3 scripts/check_site.py
      - name: Validate measurement privacy and consent lifecycle
        run: node scripts/test_measurement.cjs
